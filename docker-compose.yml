version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: vendorhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-vendorhub_db}
      POSTGRES_USER: ${DB_USERNAME:-vendorhub_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-vendorhub_user} -d ${DB_NAME:-vendorhub_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vendorhub-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-vendorhub_db}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-vendorhub_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      APP_JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      APP_AI_SERVICE_URL: http://ai-service:8000
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/v3/api-docs || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: vendorhub-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PORT: 8000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vendorhub-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  postgres_data:
